# Publie la Release avec RegiePartage-X.Y.Z-windows.zip :
#  - soit en poussant un tag vX.Y.Z ;
#  - soit depuis GitHub : Actions > Release > Run workflow, en saisissant la
#    version (le tag vX.Y.Z est alors créé sur le dernier commit de main).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (ex. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Version
        run: |
          if [ -n "${{ inputs.version }}" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          V="${V#v}"
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Compilation
        run: VERSION="$V" ./build.sh
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" dist/RegiePartage-$V-*.zip --clobber
          else
            gh release create "v$V" dist/RegiePartage-$V-*.zip \
              --target "$GITHUB_SHA" \
              --title "Régie Partage $V" \
              --notes "Mise à jour : quitter Régie Partage, dézipper et remplacer les fichiers (Windows : RegiePartage.exe ; Mac : zip -mac, pour essais). Réglages et connexion sont conservés."
          fi
